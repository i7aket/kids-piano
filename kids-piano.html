<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1E3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kids Piano — One-Hand Melodies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1E3C;
  --snow:#F2F7FF;
  --gold:#F6C453;
  --mint:#7BDDBE;
  --berry:#E9684F;
  --dim:#8FA6CC;
  --line:#2A487A;
  --card:#1B3157;
  --red:#FF5145;
  --display:"Comfortaa","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;overscroll-behavior:none}
body{
  background:var(--night);color:var(--snow);font-family:var(--body);
  min-height:100dvh;padding:16px 16px 0;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font-family:inherit;touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}

.songbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.songbar .step{flex:0 0 42px}
.songs{flex:1;min-width:0;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:3px 0;
  scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.songs::-webkit-scrollbar{display:none}
.song{
  background:var(--card);color:var(--snow);border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;font-size:14.5px;font-weight:600;cursor:pointer;
}
.song[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#0A2A21}
.song{flex:0 0 auto;white-space:nowrap}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 -16px 8px;padding:6px 16px 8px;
  position:sticky;top:0;z-index:2;background:var(--night)}
.play{
  display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#2A1B00;
  border:none;border-radius:999px;padding:14px 26px;min-height:52px;
  font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;
}
.play.playing{background:var(--berry);color:#fff}
.learn.on{background:var(--mint);border-color:var(--mint);color:#0A2A21}
.key.good{background:var(--mint);transform:translateY(3px)}
.chip.good{background:var(--mint);border-color:var(--mint)}
.chip.good b{color:#0A2A21}
.chip.good span{color:#0A2A21}
.play:focus-visible,.song:focus-visible,.tempo input:focus-visible,.key:focus-visible,.black:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.tempo{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:14px}
.tempo input{width:130px;height:34px;accent-color:var(--mint)}
.tempo #bpm{min-width:30px;text-align:center;color:var(--snow);font-weight:700}
.step{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--snow);
  border:1px solid var(--line);font-size:22px;line-height:1;cursor:pointer}
.step:active{background:var(--mint);color:#0A2A21}
.step:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
@media (pointer:coarse){.tempo input{display:none}}
.tip{color:var(--dim);font-size:14.5px;line-height:1.5;margin:0 0 18px}

/* room below the last row so any row can scroll up under the controls */
.strip{display:flex;flex-direction:column;margin-bottom:20px;padding-bottom:45vh}
.phrase{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:clamp(4px,1vw,7px)}
.chip{min-width:0;padding:clamp(5px,1.4vw,8px) 0 clamp(4px,1.2vw,7px);border-radius:11px;background:var(--card);border:1px solid var(--line);text-align:center}
.chip b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(13px,3.2vw,20px);line-height:1}
.chip span{display:block;font-size:clamp(10px,2.1vw,12px);color:var(--dim);margin-top:3px}
.chip.on{background:var(--gold);border-color:var(--gold)}
.chip.on b{color:#2A1B00}
.chip.on span{color:#6A4A05}

.line{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));
  gap:clamp(4px,1vw,7px);padding:5px 0 clamp(9px,2.2vw,15px)}
.line .text{min-width:max-content;font-family:var(--display);font-weight:700;
  font-size:clamp(14px,3.4vw,19px);line-height:1.35;color:#5D769E;
  text-align:center;transition:color .12s linear}
.line.now .text{color:var(--snow)}
.syl.on{color:var(--red)}

.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-24px;color:#fff;font-style:normal;animation:fall linear infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(var(--dx,0px),110vh,0) rotate(var(--r,180deg))}}
.wrap{position:relative;z-index:1}

.dock{
  position:sticky;bottom:0;margin-top:auto;
  background:linear-gradient(to top,var(--night) 76%,rgba(14,30,60,0));
  padding:14px 0 calc(10px + env(safe-area-inset-bottom));
}
.board{border-radius:14px;background:#060F22;padding:10px 10px 0;max-width:100%;margin:0 auto;box-sizing:content-box}
@media (min-width:700px){
  .dock{margin-left:calc(50% - 50vw + 16px);margin-right:calc(50% - 50vw + 16px)}
}
.keys{position:relative;height:100%}
.whites{display:flex;gap:0;height:100%}
.key{
  flex:0 0 var(--kw,50px);width:var(--kw,50px);min-width:0;border:none;border-left:2px solid #060F22;padding:0 0 12px;
  cursor:pointer;border-radius:0 0 10px 10px;background:var(--snow);
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;
  touch-action:none;transition:background .05s linear,transform .05s linear;
}
.key.mute{background:#CFD9EA}
.key.on{background:var(--gold);transform:translateY(3px)}
.finger{
  width:clamp(24px,6.4vw,30px);height:clamp(24px,6.4vw,30px);border-radius:50%;
  background:#0E1E3C;color:var(--snow);font-family:var(--display);font-weight:700;
  font-size:clamp(13px,3.4vw,15px);display:flex;align-items:center;justify-content:center;
}
.finger.step{box-shadow:0 0 0 2px var(--mint)}
.name{font-family:var(--display);font-weight:700;font-size:clamp(14px,3.6vw,17px);color:#12213D}
.key.mute .name{color:#5F7091}
#blacks{position:absolute;top:0;left:0;right:0;height:0}
.black{
  position:absolute;top:0;border:none;background:#0A1730;border-radius:0 0 8px 8px;
  cursor:pointer;touch-action:none;transition:background .05s linear;
}
.black.on{background:var(--mint)}

/* learn mode: the target key and chip breathe until it is played */
@keyframes pulse{0%,100%{background:var(--gold)}50%{background:#FCE6AE}}
.key.target{background:var(--gold);transform:translateY(3px);animation:pulse .9s ease-in-out infinite}
.black.target{background:var(--gold);animation:pulse .9s ease-in-out infinite}
.chip.target{background:var(--gold);border-color:var(--gold);animation:pulse .9s ease-in-out infinite}
.chip.target b{color:#2A1B00}
.chip.target span{color:#6A4A05}
.key.miss,.black.miss{background:var(--berry)}
.key.miss .name{color:#3A0E06}
.badge{position:absolute;top:6px;transform:translateX(-50%);z-index:3;pointer-events:none;
  background:var(--night);color:var(--gold);border:1px solid var(--gold);border-radius:999px;
  padding:2px 9px;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}

.hint{color:var(--dim);font-size:13.5px;line-height:1.6;margin:10px 0 0}
.hint kbd{font-family:var(--body);font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--snow)}
@media (pointer:coarse){.hint.desktop{display:none}}
@media (pointer:fine){.hint.touch{display:none}}
@media (prefers-reduced-motion:reduce){.key,.chip,.black{transition:none}
  .key.target,.black.target,.chip.target{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="songbar">
    <button class="step" id="songsLeft" type="button" aria-label="Scroll songs left">&#8249;</button>
    <div class="songs" id="songs"></div>
    <button class="step" id="songsRight" type="button" aria-label="Scroll songs right">&#8250;</button>
  </div>

  <div class="bar">
    <button class="play" id="play"><span id="glyph">▶</span><span id="playLabel">Play</span></button>
    <button class="song" id="restart" type="button">↺ Restart</button>
    <button class="song learn" id="learn" type="button" title="Listen to your piano and wait for the right note">🎤 Learn</button>
    <div class="tempo">Tempo
      <button class="step" id="slower" type="button" aria-label="Slower">−</button>
      <input type="range" id="tempo" min="50" max="140" value="90" step="2">
      <span id="bpm">90</span>
      <button class="step" id="faster" type="button" aria-label="Faster">+</button>
    </div>
  </div>
  <p class="tip" id="tip"></p>
  <p class="tip" id="debug" hidden style="font-family:monospace;font-size:12px;margin-top:-10px"></p>

  <div class="strip" id="strip"></div>

  <div class="dock">
    <div class="board" id="board">
      <div class="keys">
        <div class="whites" id="whites"></div>
        <div id="blacks"></div>
      </div>
    </div>
    <p class="hint desktop">On a computer: <kbd>1</kbd>–<kbd>8</kbd> (low keys <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd>) or <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd>. Space starts and stops the melody.</p>
    <p class="hint touch">You can press several keys at once. If there is no sound, make sure your phone is not in silent mode.</p>
  </div>

</div>

let ctx = null, dry = null, wet = null;

function buildReverb(c){
  const len = Math.floor(c.sampleRate * 1.9);
  const buf = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++){
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < 250 ? i / 250 : 1);
    }
  }
  const conv = c.createConvolver();
  conv.buffer = buf;
  return conv;
}

function audio(){
  if (!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.release.value = .25;
    comp.connect(ctx.destination);
    dry = ctx.createGain(); dry.gain.value = .55; dry.connect(comp);
    const conv = buildReverb(ctx);
    const damp = ctx.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 3600;
    wet = ctx.createGain(); wet.gain.value = .2;
    wet.connect(damp); damp.connect(conv); conv.connect(comp);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function unlock(){
  const c = audio();
  const b = c.createBuffer(1, 1, c.sampleRate);
  const s = c.createBufferSource();
  s.buffer = b; s.connect(c.destination); s.start(0);
}
["pointerdown","touchstart","click"].forEach(ev =>
  document.addEventListener(ev, unlock, {once:true, passive:true}));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ctx && ctx.state === "suspended") ctx.resume();
});

const PARTIALS = [[1,1,1],[2,.46,.74],[3,.24,.58],[4,.14,.45],[5,.085,.36],[6,.05,.3],[7,.03,.25],[9,.018,.19]];

function note(freq, at, hold){
  const c = audio();
  const ring = 3.1 * Math.pow(300 / freq, .45);
  const stop = Math.min(ring, Math.max(hold, .28) + 1.1);

  const body = c.createGain();
  body.gain.setValueAtTime(1, at);
  body.gain.setValueAtTime(1, at + Math.max(hold, .25));
  body.gain.exponentialRampToValueAtTime(.0001, at + stop);

  const tone = c.createBiquadFilter();
  tone.type = "lowpass"; tone.Q.value = .7;
  tone.frequency.setValueAtTime(Math.min(freq * 9, 11000), at);
  tone.frequency.exponentialRampToValueAtTime(Math.max(freq * 2.4, 700), at + .8);

  body.connect(tone); tone.connect(dry); tone.connect(wet);

  const nodes = [];
  PARTIALS.forEach(([mult, amp, decay]) => {
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.value = freq * mult * (1 + 0.00045 * mult * mult);
    o.detune.value = (Math.random() - .5) * 4;
    const g = c.createGain();
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(amp * .22, at + .008 + mult * .0012);
    g.gain.exponentialRampToValueAtTime(.00002, at + ring * decay);
    o.connect(g); g.connect(body);
    o.start(at); o.stop(at + stop + .1);
    nodes.push(o);
  });

  const nb = c.createBuffer(1, Math.floor(c.sampleRate * .05), c.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 5);
  const src = c.createBufferSource(); src.buffer = nb;
  const nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = freq * 3.5; nf.Q.value = .8;
  const ng = c.createGain(); ng.gain.value = .05;
  src.connect(nf); nf.connect(ng); ng.connect(body);
  src.start(at); nodes.push(src);

  return nodes;
}

// letter shown to a child: label() without the octave arrows
function plain(n){ return label(n).replace(/[\u2191\u2193]/, ""); }
// white-key position of any key, black keys counting as the white one below them
function whiteIdx(k){ return k.n && IDX[k.n] !== undefined ? IDX[k.n] : k.after; }

let lo = IDX.C4, hi = IDX.G4;   // white-key window of the current song, set in select()
function songRange(sg){
  let a = IDX.C4, b = IDX.G4;   // never narrower than the five-finger position
  sg.phrases.flat().forEach(([n]) => { const [x, y] = span(n); a = Math.min(a, x); b = Math.max(b, y); });
  return [a, b];
}
// widest window any song needs: every song shares one key width so the keys never change size
const MAX_KEYS = Math.max(...SONGS.map(sg => { const [a, b] = songRange(sg); return b - a + 1; }));

function layout(){
  const vh = window.innerHeight || 700;
  const h = Math.max(150, Math.min(240, Math.round(vh * 0.30)));
  boardEl.style.height = (h + 10) + "px";

  const room = boardEl.parentElement.clientWidth - 20;
  // tablets and desktops: the whole two octaves stretched to the full width;
  // phones: only the song's range, with one key width shared by every song
  const wide = room >= 640;
  // three octaves C3..C6 when keys stay at least 44px, otherwise two octaves C3..C5
  const count = wide ? (room / WHITE.length >= 44 ? WHITE.length : IDX.C5 + 1) : 0;
  const from = wide ? 0 : lo, to = wide ? count - 1 : hi;
  const kw = wide ? Math.floor(Math.min(64, room / count)) : Math.floor(Math.min(64, room / MAX_KEYS));
  boardEl.style.setProperty("--kw", kw + "px");
  boardEl.style.width = ((to - from + 1) * kw) + "px";   // explicit: WebKit ignores flex-basis for max-content

  WHITE.forEach((w, i) => { w.el.style.display = i >= from && i <= to ? "" : "none"; });
  const bw = kw * 0.58;
  BLACK.forEach(bk => {
    if (bk.after < from || bk.after >= to){ bk.el.style.display = "none"; return; }
    bk.el.style.display = "";
    bk.el.style.width = bw + "px";
    bk.el.style.left = (kw * (bk.after + 1 - from) - bw / 2) + "px";
    bk.el.style.height = Math.round(h * 0.58) + "px";
  });
}
layout();

addEventListener("orientationchange", () => setTimeout(layout, 250));

const litTimers = new Map();
function light(el, ms){
  clearTimeout(litTimers.get(el));
  el.classList.remove("on");
  void el.offsetWidth;
  el.classList.add("on");
  litTimers.set(el, setTimeout(() => el.classList.remove("on"), ms));
}

function hit(el, freq){
  note(freq, audio().currentTime, .35);
  light(el, 220);
}

// +/- keep the melody going at the new tempo instead of forcing a restart
function nudge(d){
  const v = Math.min(140, Math.max(50, Number(tempoEl.value) + d));
  if (v === Number(tempoEl.value)) return;
  tempoEl.value = v;
  bpmEl.textContent = v;
  if (mode === "playing"){ pause(); start(); }
}

let mode = "stopped", cursor = 0, t0 = 0, marks = [];
const restartBtn = document.getElementById("restart");

function killVoices(){
  timers.forEach(clearTimeout); timers = [];
  litTimers.forEach(clearTimeout); litTimers.clear();
  voices.forEach(o => { try { o.stop(); } catch(e){} }); voices = [];
}

function clearHighlights(){
  chipEls.forEach(c => c.classList.remove("on", "good", "target"));
  lyricEls.forEach(l => l.classList.remove("on"));
  lineEls.forEach(l => l.classList.remove("now"));
  ALLKEYS.forEach(k => k.el.classList.remove("on", "good", "target", "miss"));
  clearTimeout(missTimer);
  if (badgeEl){ badgeEl.remove(); badgeEl = null; }
}
let missTimer = 0, badgeEl = null;

function setMode(m){
  mode = m;
  playing = m === "playing";
  playBtn.classList.toggle("playing", playing);
  glyph.textContent = playing ? "❚❚" : "▶";
  playLabel.textContent = playing ? "Pause" : (m === "paused" ? "Resume" : "Play");
}

function stop(){
  learnStop();
  killVoices();
  clearHighlights();
  cursor = 0;
  setMode("stopped");
}

function pause(){
  const elapsed = ctx ? ctx.currentTime - t0 : 0;
  let idx = cursor;
  for (const m of marks){ if (m.at <= elapsed) idx = m.i; else break; }
  killVoices();
  cursor = idx;
  setMode("paused");
}

// A note scheduled at ctx time T is only heard at T + output latency, while a
// timer fires on the dot, so without this the highlight runs ahead of the sound.
// ponytail: auto value only; add a manual offset if a device misreports it.
function outLagMs(c){
  const l = typeof c.outputLatency === "number" && c.outputLatency > 0
    ? c.outputLatency : (c.baseLatency || 0) * 2;
  return Math.min(l * 1000, 400);
}

// When the row being played (or the next one) slides under the keyboard dock,
// scroll the page so the current row sits at the top and the next row shows.
const dockEl = document.querySelector(".dock");
const barEl = document.querySelector(".bar");
let lastRow = null;
function keepVisible(i){
  const row = chipEls[i].parentNode;
  if (row === lastRow) return;
  lastRow = row;
  const line = row.nextElementSibling;                       // this row's lyric
  const nextRow = line && line.nextElementSibling;
  const ahead = (nextRow && nextRow.nextElementSibling) || line || row;   // next row's lyric
  const limit = dockEl.getBoundingClientRect().top;
  const ceiling = barEl.getBoundingClientRect().bottom + 8;   // just under the sticky controls
  const top = row.getBoundingClientRect().top;
  if (top < ceiling || ahead.getBoundingClientRect().bottom > limit)
    window.scrollBy({top: top - ceiling, behavior: "smooth"});
}

function start(){
  learnStop();
  const c = audio();
  lastRow = null;
  const beat = 60 / Number(tempoEl.value);
  const lag = outLagMs(c);
  t0 = c.currentTime + .2;
  marks = [];
  let t = 0;
  for (let i = cursor; i < seq.length; i++){
    const [n, beats] = seq[i];
    const dur = beats * beat;
    marks.push({i:i, at:t});
    voices.push(...note(FREQ[n], t0 + t, dur * .92));
    const ms = dur * 1000;
    const lit = Math.max(70, Math.min(ms - 60, ms * .72));
    timers.push(setTimeout(() => {
      chipEls.forEach(x => x.classList.remove("on"));
      chipEls[i].classList.add("on");
      keepVisible(i);
      lyricEls.forEach(x => x.classList.remove("on"));
      const syl = lyricEls[i];
      if (syl){
        syl.classList.add("on");
        lineEls.forEach(l => l.classList.toggle("now", l === syl.closest(".line")));
      }
      light(keyEls[n], lit);
    }, (t0 + t - c.currentTime) * 1000 + lag));
    t += dur;
  }
  timers.push(setTimeout(() => {
    clearHighlights();
    cursor = 0;
    setMode("stopped");
  }, (t0 + t - c.currentTime) * 1000 + lag + 500));
  setMode("playing");
}

function toggle(){ mode === "playing" ? pause() : start(); }

playBtn.addEventListener("click", toggle);
restartBtn.addEventListener("click", () => {
  const wasPlaying = mode === "playing";
  killVoices();
  clearHighlights();
  cursor = 0;
  if (wasPlaying) start(); else setMode("stopped");
});

const learn = {on:false, i:0, armed:false, hits:0, bad:0, noise:0.002,
               lastHz:0, recent:[], evalUntil:0,
               stream:null, src:null, analyser:null, detector:null, buf:null, raf:0, gate:0};

function octaveName(n, d){ return n.replace(/\d/, m => String(Number(m) + d)); }
// same note letter in any octave: octave slips at a note's onset must not look like a new note
function samePitchClass(hz, ref){
  const c = ((1200 * Math.log2(hz / ref)) % 1200 + 1200) % 1200;
  return c <= 50 || c >= 1150;
}
// accept the target within a quarter tone; accept its octave neighbour only when
// that note is not itself part of the song, so G3 vs G4 songs stay strict
function matches(hz, n){
  const used = new Set(seq.map(([x]) => x));
  const near = f => Math.abs(1200 * Math.log2(hz / f)) <= 50;
  if (near(FREQ[n])) return true;
  if (!used.has(octaveName(n, 1)) && near(FREQ[n] * 2)) return true;
  if (!used.has(octaveName(n, -1)) && near(FREQ[n] / 2)) return true;
  return false;
}

async function learnStart(){
  if (!window.PitchDetector){ tipEl.textContent = "The note detector did not load. Check the internet connection and reload."; return; }
  stop();
  const c = audio();
  try {
    learn.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  } catch (e){
    tipEl.textContent = "Microphone not available. Allow the microphone for this page and try again.";
    return;
  }
  learn.src = c.createMediaStreamSource(learn.stream);
  learn.analyser = c.createAnalyser();
  learn.analyser.fftSize = 4096;
  learn.src.connect(learn.analyser);
  learn.detector = PitchDetector.forFloat32Array(4096);
  learn.buf = new Float32Array(4096);
  learn.on = true; learn.noise = 0.002; learn.lastHz = 0; learn.recent = [];
  learnBtn.classList.add("on"); learnBtn.textContent = "■ Stop";
  playBtn.disabled = true;
  lastRow = null;
  learnStep(0);
  learn.raf = requestAnimationFrame(learnFrame);
}

function learnStop(){
  if (!learn.on) return;
  learn.on = false;
  cancelAnimationFrame(learn.raf); clearTimeout(learn.gate);
  if (learn.stream) learn.stream.getTracks().forEach(t => t.stop());
  if (learn.src) learn.src.disconnect();
  learn.stream = learn.src = learn.analyser = null;
  learnBtn.classList.remove("on"); learnBtn.textContent = "🎤 Learn";
  playBtn.disabled = false;
  clearHighlights();
  tipEl.textContent = current.tip;
}

function showTarget(i){
  const [n] = seq[i];
  clearHighlights();
  chipEls[i].classList.add("target");
  keyEls[n].classList.add("target");
  lyricEls[i].classList.add("on");
  lineEls.forEach(l => l.classList.toggle("now", l === lyricEls[i].closest(".line")));
  keepVisible(i);
}

function learnStep(i){
  clearTimeout(learn.gate);
  if (i >= seq.length){
    tipEl.textContent = "Well done! You played the whole song.";
    Object.values(keyEls).forEach(k => k.classList.add("good"));
    setTimeout(learnStop, 1500);
    return;
  }
  learn.i = i; learn.hits = 0; learn.bad = 0; learn.evalUntil = 0;
  showTarget(i);
  tipEl.textContent = askTip(i);
  learn.armed = true;   // the page stays silent in Learn mode: it only waits
}

function askTip(i){ return "Play the " + plain(seq[i][0]) + " key on your piano."; }

// one wrong note -> one hint: colour the key that was played, say how far it is
function learnMiss(hz){
  const i = learn.i, tgt = seq[i][0];
  learn.hits = 0; learn.bad = 0; learn.evalUntil = 0;
  learn.lastHz = hz;
  learn.armed = false;
  learn.gate = setTimeout(() => { learn.armed = true; }, 400);

  let best = null, bd = Infinity;
  ALLKEYS.forEach(k => { const d = Math.abs(1200 * Math.log2(hz / k.f)); if (d < bd){ bd = d; best = k; } });

  if (bd > 50){                                   // outside C3..C6, no key to blame
    tipEl.textContent = hz < best.f ? "Too low. Move to the right \u2192" : "Too high. Move to the left \u2190";
  } else {
    best.el.classList.add("miss");
    const d = whiteIdx(ALLKEYS.find(k => k.n === tgt)) - whiteIdx(best);  // + means the target is to the right
    const heard = best.n ? plain(best.n) : plain(WHITE[best.after].n) + "\u266F";
    const want = plain(tgt);
    const keys = Math.abs(d) === 1 ? "1 key" : Math.abs(d) + " keys";
    const way = d > 0 ? "right \u2192" : "left \u2190";
    tipEl.textContent = !d ? "That was " + heard + ". The " + want + " is the white key just below it."
      : heard === want ? "That was a " + heard + ", but a " + (d > 0 ? "lower" : "higher") + " one. Go " + keys + " to the " + way
      : "That was " + heard + ". The " + want + " is " + keys + " to the " + way;
    if (d){
      badgeEl = document.createElement("div");
      badgeEl.className = "badge";
      badgeEl.textContent = d > 0 ? "\u2192 " + Math.abs(d) : Math.abs(d) + " \u2190";
      keysEl.appendChild(badgeEl);
      const t = keyEls[tgt];
      badgeEl.style.left = (t.offsetLeft + t.offsetWidth / 2) + "px";
    }
  }
  missTimer = setTimeout(() => {
    if (badgeEl){ badgeEl.remove(); badgeEl = null; }
    if (best) best.el.classList.remove("miss");
    if (learn.on && learn.i === i) tipEl.textContent = askTip(i);
  }, 900);
}

function learnFrame(){
  if (!learn.on) return;
  learn.analyser.getFloatTimeDomainData(learn.buf);
  let sum = 0; for (let k = 0; k < learn.buf.length; k++) sum += learn.buf[k] * learn.buf[k];
  const rms = Math.sqrt(sum / learn.buf.length);
  // ponytail: crude adaptive noise floor (slow-rising minimum); replace with a real
  // level meter if phones with aggressive auto-gain never look "quiet"
  learn.noise = rms < learn.noise ? rms : learn.noise * 0.999 + rms * 0.001;
  // level over the last ~160 ms: a decaying note barely moves it, a new attack jumps above it
  learn.recent.push(rms); if (learn.recent.length > 10) learn.recent.shift();
  const recentMin = Math.min(...learn.recent);
  const loud = learn.noise * 4 + 0.006;
  if (debugEl){   // #debug in the URL: live readout for tuning on a real piano
    const [dhz, dcl] = rms > 0.003 ? learn.detector.findPitch(learn.buf, ctx.sampleRate) : [0, 0];
    const midi = dhz > 0 ? Math.round(69 + 12 * Math.log2(dhz / 440)) : null;
    const name = midi === null ? "-" : ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][midi % 12] + (Math.floor(midi / 12) - 1);
    debugEl.textContent = "rms " + rms.toFixed(3) + " noise " + learn.noise.toFixed(3) + " recent " + recentMin.toFixed(3) + " | " + Math.round(dhz) + " Hz " + name +
      " clarity " + dcl.toFixed(2) + " | armed " + learn.armed + " eval " + (learn.evalUntil > performance.now()) + " hits " + learn.hits + " bad " + learn.bad;
  }
  if (learn.armed && rms > loud){
    const [hz, clarity] = learn.detector.findPitch(learn.buf, ctx.sampleRate);
    const now = performance.now();
    if (clarity > 0.8){
      // a new note is either a different pitch or a fresh attack of the same pitch
      const fresh = !learn.lastHz || !samePitchClass(hz, learn.lastHz) || rms > recentMin * 1.35 + 0.005;
      if (fresh && now > learn.evalUntil){ learn.evalUntil = now + 350; learn.hits = 0; learn.bad = 0; }
      if (now <= learn.evalUntil){
        const right = matches(hz, seq[learn.i][0]);
        learn.hits = right ? learn.hits + 1 : 0;
        learn.bad = right ? 0 : learn.bad + 1;
        if (learn.bad >= 3) learnMiss(hz);
        else if (learn.hits >= 3){
          learn.armed = false; learn.hits = 0; learn.evalUntil = 0;
          learn.lastHz = FREQ[seq[learn.i][0]];         // the same held note must re-attack to count again
          const i = learn.i, n = seq[i][0];
          chipEls[i].classList.remove("target"); keyEls[n].classList.remove("target");
          chipEls[i].classList.add("good"); keyEls[n].classList.add("good");
          setTimeout(() => { chipEls[i].classList.remove("good"); keyEls[n].classList.remove("good"); if (learn.on) learnStep(i + 1); }, 350);
        }
      }
    }
  }
  learn.raf = requestAnimationFrame(learnFrame);
}

learnBtn.addEventListener("click", () => learn.on ? learnStop() : learnStart());

const KEYMAP = {"1":"C4","2":"D4","3":"E4","4":"F4","5":"G4","6":"A4","7":"B4","8":"C5",
                "a":"C4","s":"D4","d":"E4","f":"F4","g":"G4","h":"A4","j":"B4","k":"C5",
                "q":"G3","w":"A3","e":"B3",
                "ф":"C4","ы":"D4","в":"E4","а":"F4","п":"G4","р":"A4","о":"B4","л":"C5"};
document.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space"){ e.preventDefault(); toggle(); return; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    if (e.target.tagName === "INPUT") return;
    e.preventDefault(); scrollSongs(e.key === "ArrowRight" ? 1 : -1); return;
  }
  const n = KEYMAP[e.key.toLowerCase()];
  if (n) hit(keyEls[n], FREQ[n]);
});

if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const snow = document.createElement("div");
  snow.className = "snow";
  snow.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 28; i++){
    const f = document.createElement("i");
    f.textContent = i % 3 ? "\u2744" : "\u2745";
    f.style.left = (Math.random() * 100).toFixed(2) + "%";
    f.style.fontSize = (8 + Math.random() * 13).toFixed(1) + "px";
    f.style.opacity = (.2 + Math.random() * .5).toFixed(2);
    f.style.setProperty("--dx", (Math.random() * 90 - 45).toFixed(0) + "px");
    f.style.setProperty("--r", (Math.random() * 540 - 270).toFixed(0) + "deg");
    f.style.animationDuration = (8 + Math.random() * 10).toFixed(1) + "s";
    f.style.animationDelay = (-Math.random() * 18).toFixed(1) + "s";
    snow.appendChild(f);
  }
  document.body.appendChild(snow);
}

select(SONGS[0]);
